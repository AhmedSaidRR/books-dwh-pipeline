[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: needs a running PostgreSQL warehouse (RUN_DB_TESTS=1)",
]

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = [".venv", "data", "logs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = ["E501"]

[tool.coverage.run]
source = ["src"]
omit = ["src/pipeline.py"]
